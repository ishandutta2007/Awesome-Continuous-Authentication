<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: url(#text-grad);
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .wave-line {
      fill: none;
      stroke: url(#line-grad);
      stroke-width: 3;
    }
    .pulse-dot {
      fill: #38bdf8;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      100% { r: 4px; opacity: 0.4; }
    }
    .pulse-wave {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 4s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.08">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic Animated Graph Lines in Background (Behind Text) -->
  <g opacity="0.4">
    <path class="wave-line pulse-wave" d="M 50,220 Q 200,120 350,230 T 650,180 T 950,240 T 1150,150" stroke-width="2"/>
    <path class="wave-line pulse-wave" d="M 50,250 Q 250,280 450,190 T 750,220 T 1050,130 T 1150,190" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Signal Nodes (Dynamic Aspect) -->
  <g filter="url(#glow)">
    <circle cx="350" cy="230" class="pulse-dot"/>
    <circle cx="650" cy="180" class="pulse-dot" style="animation-delay: 0.7s;"/>
    <circle cx="950" cy="240" class="pulse-dot" style="animation-delay: 1.4s;"/>
  </g>

  <!-- Foreground Badge -->
  <g transform="translate(60, 45)">
    <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#10b981"/>
    <text x="30" y="20" class="badge-text">BEHAVIORAL BIOMETRICS &amp; ZERO TRUST</text>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed Clear Visibility) -->
  <text x="60" y="130" class="title" filter="url(#glow)">Awesome Continuous Authentication</text>
  <text x="60" y="175" class="subtitle">Curated SaaS Platforms, Behavioral Biometrics &amp; Open-Source Identity Security Ecosystem</text>

  <!-- Bottom Signals Indicator Bar -->
  <g transform="translate(60, 220)">
    <rect width="1080" height="40" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
    <text x="25" y="25" fill="#64748b" font-family="sans-serif" font-size="13" font-weight="600">KEY SIGNALS:</text>
    <text x="125" y="25" fill="#38bdf8" font-family="sans-serif" font-size="13">⚡ Keystroke Dynamics</text>
    <text x="305" y="25" fill="#818cf8" font-family="sans-serif" font-size="13">🖱️ Mouse Kinematics</text>
    <text x="475" y="25" fill="#c084fc" font-family="sans-serif" font-size="13">📱 Touch Gestures</text>
    <text x="625" y="25" fill="#f43f5e" font-family="sans-serif" font-size="13">🛡️ Adaptive MFA &amp; Risk Scoring</text>
  </g>
</svg>
