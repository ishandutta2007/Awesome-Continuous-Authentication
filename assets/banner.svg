<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="line-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".1"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse{0%{r:4px;opacity:.4}50%{r:9px;opacity:1;filter:drop-shadow(0 0 6px #38bdf8)}}.title{font-size:46px;font-weight:800;fill:url(#text-grad);letter-spacing:-1px}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.subtitle{font-size:18px;font-weight:400;fill:#94a3b8;letter-spacing:.5px}.badge-text{font-size:13px;font-weight:600;fill:#38bdf8}.wave-line{fill:none;stroke:url(#line-grad);stroke-width:3}.pulse-dot{fill:#38bdf8;animation:pulse 2s infinite ease-in-out}.pulse-wave{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dash 4s linear infinite}</style><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g opacity=".08"><path stroke="#fff" stroke-width="1" d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200"/><path stroke="#fff" stroke-width="1" d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300"/></g><g opacity="